# B-2 Path Ownership Map
#
# Machine-readable ownership for the eight B-2 AI teams.
# CI must fail any PR that touches paths outside the submitting team's write list.
# Team doc reference: docs/teams/README.md
# Message system:     docs/teams/messaging.md
#
# Shared, non-team paths (no team may write without an approved message or
# integrator approval):
#   docs/laws.md            — law amendments follow Rule 145 / integrator approval
#   docs/deopt_backend.md   — cross-team deopt/backend contract (Interpreter,
#                             Baseline No-IR, IR, Codegen, AOT)
#   docs/stencils.md        — shared stencil format contract; changes require an
#                             RFC per Stencil Rule 10 / Amendment C
#   docs/cpp26_standards.md — repo-wide C++26 standards and testing contract
#   docs/teams/*            — team organization and charters
#   messages/*              — message space (message files only, per messaging.md)
#   .github/, CI config     — integrator-owned
#
# The T1 baseline (baseline_noir) intentionally owns no IR paths (Amendment A).
# The AOT team drives the shared T2 pipeline; it must not fork it (Amendment B).
# The frontend owns the Java-source path (source -> AST); AST -> RBC lowering
# will be contracted via messages before it lands.

teams:
  frontend:
    write:
      - compiler/frontend/
      - include/b2/frontend/
      - tests/frontend/
      - docs/frontend_contract.md

  interpreter:
    write:
      - compiler/interp/
      - tests/interp/
      - docs/interp_contract.md

  baseline_noir:
    write:
      - compiler/baseline/
      - tests/baseline/
      - docs/baseline_contract.md

  ir:
    write:
      - compiler/ir/core/
      - include/b2/ir/
      - tests/ir/
      - docs/ir_spec.md
      - docs/effect_system.md
      # RBC core (middle-end v0): shared contract consumed by all tiers;
      # opcode/format changes require a cross-team message per messaging.md.
      - compiler/rbc/
      - include/b2/rbc/
      - tests/rbc/
      - docs/rbc_spec.md

  passes:
    write:
      - compiler/passes/
      - compiler/pipeline/
      - tests/passes/
      - docs/pass_contracts.md
      # Special pass designs (CM-PEA, effect reordering, adaptive value
      # representation): passes-team owned; NaN boxing representation
      # contracts remain cross-team per the NaN Boxing Rule ownership clause.
      - docs/special_passes.md

  regalloc:
    write:
      - compiler/regalloc/
      - tests/regalloc/
      - docs/regalloc_contract.md

  codegen:
    write:
      - compiler/codegen/
      - tests/codegen/
      - docs/codegen_contract.md

  aot:
    write:
      - compiler/aot/
      - tests/aot/
      - docs/aot_contract.md
